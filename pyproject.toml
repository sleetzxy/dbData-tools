[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbdata-tools"
version = "1.4.0"
description = "基于 Tkinter 的 PostgreSQL 数据工具桌面应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter==5.2.2",
  "psycopg2-binary==2.9.11",
  "pypinyin==0.55.0",
  "pyzipper==0.3.6",
  "clickhouse-connect==0.8.18",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-mock>=3.12",
  "pyright>=1.1.350,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "db*", "gui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

# Pyright / Pylance（IDE 静态分析）：让 IDE 知道业务包在 src/ 下，
# 即便没有 pip install -e . 也能正确解析 from core.../from gui... 等导入。
# Pyright：默认 basic；CI/本地可用 ``pyright`` 复现。strict 需先补齐 customtkinter 等 stub。
[tool.pyright]
include = ["src", "tests", "main_gui.py"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
