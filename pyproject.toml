[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbdata-tools"
version = "1.4.0"
description = "基于 Tkinter 的 PostgreSQL 数据工具桌面应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter==5.2.2",
  "psycopg2-binary==2.9.11",
  "pypinyin==0.55.0",
  "pyzipper==0.3.6",
  "clickhouse-connect==0.8.18",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "db*", "gui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Pyright / Pylance（IDE 静态分析）：让 IDE 知道业务包在 src/ 下，
# 即便没有 pip install -e . 也能正确解析 from core.../from gui... 等导入。
[tool.pyright]
include = ["src", "tests", "main_gui.py"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
